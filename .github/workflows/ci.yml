name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Release app bundle (ad-hoc signed)
        run: CONFIG=release scripts/build-app.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/NameShift.app build/NameShift.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NameShift-app
          path: build/NameShift.zip
          retention-days: 14
